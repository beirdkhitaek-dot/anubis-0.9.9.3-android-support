name: Build and release from zip

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Unpack the source zip
        run: |
          unzip -q -o anubis-android-0.9.9.3-source.zip -d work

      - name: Build the jar
        working-directory: work
        run: python3 scripts/build.py

      - name: Read version
        id: meta
        working-directory: work
        run: |
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          echo "title=$(cat dist/release-title.txt)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Anubis_Beta_${{ steps.meta.outputs.version }}
          path: work/dist/*.jar

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          TITLE: ${{ steps.meta.outputs.title }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "::error::Release v${VERSION} already exists. Change VERSION inside the zip, upload it again, then re-run."
            exit 1
          fi
          gh release create "v${VERSION}" "work/dist/Anubis_Beta_${VERSION}.jar" \
            --title "${TITLE}" \
            --notes-file work/dist/release-notes.md \
            --target "${GITHUB_SHA}"
